name: Sincronizar dados detalhados do Questlog

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: questlog-sync
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Consultar fichas individuais no Questlog
        run: node scripts/sync-item-details.mjs

      - name: Salvar dados atualizados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/item-details.json
          if git diff --cached --quiet; then
            echo "Os dados não mudaram; nenhum commit necessário."
          else
            git commit -m "Atualiza detalhes de equipamentos do Questlog"
            git push
          fi

      - name: Gerar índices compactos de estatísticas
        run: node scripts/build-stat-index.mjs
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Montar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
