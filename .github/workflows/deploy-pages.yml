name: Publicar Companion no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Gerar índices compactos de estatísticas
        run: node scripts/build-stat-index.mjs
      - name: Gerar índice automático das animações de habilidades
        run: node scripts/build-skill-animation-index.mjs
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Montar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4